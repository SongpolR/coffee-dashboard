function buildRecs(rows, lang) {
  const th = lang === "th";
  const pn = (p) => (lang === "en" ? (PRODUCT_EN[p] || p) : p);
  const n = (x) => Math.round(x).toLocaleString("en-US");
  const B = (x) => "฿" + n(x);
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const tLab = (t) => (th ? (t === "ice" ? "เย็น" : "ร้อน") : (t === "ice" ? "iced" : "hot"));

  let totalSales = 0, totalCups = 0; const custs = new Set();
  const prod = {}; PRODUCTS.forEach((p) => prod[p] = { sales: 0, qty: 0, ice: 0, hot: 0 });
  let iceSales = 0, hotSales = 0, toGoSales = 0, fhSales = 0, toGoCups = 0, fhCups = 0;
  const priceCups = {};
  for (const r of rows) {
    const v = r.pr * r.q;
    totalSales += v; totalCups += r.q; custs.add(r.cus);
    if (prod[r.p]) { prod[r.p].sales += v; prod[r.p].qty += r.q; prod[r.p][r.t] += v; }
    if (r.t === "ice") iceSales += v; else hotSales += v;
    if (r.k === "to go") { toGoSales += v; toGoCups += r.q; } else { fhSales += v; fhCups += r.q; }
    priceCups[r.pr] = (priceCups[r.pr] || 0) + r.q;
  }
  const ranked = PRODUCTS.map((p) => ({ p, ...prod[p] })).filter((d) => d.qty > 0).sort((a, b) => b.sales - a.sales);
  if (!ranked.length || !totalCups) return [];
  const hero = ranked[0], worst = ranked[ranked.length - 1];
  const heroType = hero.ice >= hero.hot ? "ice" : "hot";
  const custCount = custs.size || 1;
  const cupsPer = totalCups / custCount, baskPer = totalSales / custCount;
  const iceDom = iceSales >= hotSales, toGoDom = toGoSales >= fhSales;
  const prices = Object.keys(priceCups).map(Number).sort((a, b) => priceCups[b] - priceCups[a]);
  const topPrice = prices[0], topPriceCups = priceCups[topPrice] || 0;
  const nextTier = [50, 60, 70].filter((x) => x > topPrice).sort((a, b) => a - b)[0];
  const target = cupsPer + 0.2, growth = pct(target - cupsPer, cupsPer);

  const recs = [];
  recs.push({ color: "gold",
    stat: `${pct(hero.sales, totalSales)}% ${th ? "ของยอด" : "of sales"}`,
    title: th ? `${pn(hero.p)} คือพระเอก — ส่วนใหญ่เป็นแบบ${tLab(heroType)}` : `${pn(hero.p)} is the hero — mostly ${tLab(heroType)}`,
    body: th
      ? `${pn(hero.p)} ทำยอด ${B(hero.sales)} (สูงสุดในร้าน) จาก ${n(hero.qty)} แก้ว และส่วนใหญ่เป็นแบบ${tLab(heroType)} ควรชูเป็นเมนูซิกเนเจอร์ ออกสูตรพิเศษ และจัดคอมโบกับขนมเพื่อดันยอดต่อบิล`
      : `${pn(hero.p)} leads at ${B(hero.sales)} (top in store) across ${n(hero.qty)} cups, mostly ${tLab(heroType)}. Feature it as a signature, launch special recipes, and bundle with pastries to lift the per-bill total.` });

  const svPct = toGoDom ? pct(toGoSales, totalSales) : pct(fhSales, totalSales);
  recs.push({ color: "sky",
    stat: th ? `${svPct}% ${toGoDom ? "ซื้อกลับ" : "ทานที่ร้าน"}` : `${svPct}% ${toGoDom ? "takeaway" : "dine-in"}`,
    title: th ? `ลูกค้าส่วนใหญ่${toGoDom ? "ซื้อกลับ (to go)" : "ทานที่ร้าน (for here)"}` : `Most customers ${toGoDom ? "order to go" : "dine in"}`,
    body: th
      ? `ยอด${toGoDom ? "ซื้อกลับ" : "ทานที่ร้าน"} ${B(toGoDom ? toGoSales : fhSales)} จาก ${n(toGoDom ? toGoCups : fhCups)} แก้ว ${toGoDom ? "ควรลงทุนกับความเร็วหน้าร้าน จุดรับแยก พรีออเดอร์/เดลิเวอรี และบรรจุภัณฑ์ที่ดี มากกว่าการขยายที่นั่ง" : "ควรลงทุนกับบรรยากาศ ที่นั่ง และประสบการณ์ในร้าน เพื่อให้ลูกค้าอยู่นานและสั่งเพิ่ม"}`
      : `${toGoDom ? "Takeaway" : "Dine-in"} brings ${B(toGoDom ? toGoSales : fhSales)} from ${n(toGoDom ? toGoCups : fhCups)} cups. ${toGoDom ? "Invest in counter speed, a separate pickup point, pre-order/delivery and good packaging rather than more seating." : "Invest in ambience, seating and in-store experience so guests stay longer and order more."}` });

  const tPct = iceDom ? pct(iceSales, totalSales) : pct(hotSales, totalSales);
  recs.push({ color: iceDom ? "jade" : "clay",
    stat: th ? `${tPct}% เป็นเมนู${iceDom ? "เย็น" : "ร้อน"}` : `${tPct}% ${iceDom ? "iced" : "hot"}`,
    title: th ? `เครื่องดื่ม${iceDom ? "เย็น" : "ร้อน"}ครองตลาด` : `${iceDom ? "Iced" : "Hot"} drinks dominate`,
    body: th
      ? `ยอด${iceDom ? "เย็น" : "ร้อน"} ${B(iceDom ? iceSales : hotSales)} เทียบกับ${iceDom ? "ร้อน" : "เย็น"} ${B(iceDom ? hotSales : iceSales)} ${iceDom ? "ควรสต็อกน้ำแข็ง/แก้วเย็นให้พอช่วงพีค ออกเมนูเย็นตามฤดู และตรวจกำลังเครื่องทำน้ำแข็ง" : "ควรเน้นคุณภาพการสกัด/นม อุ่นแก้วก่อนเสิร์ฟ และออกเมนูร้อนพิเศษช่วงอากาศเย็น"}`
      : `${iceDom ? "Iced" : "Hot"} is ${B(iceDom ? iceSales : hotSales)} vs ${iceDom ? "hot" : "iced"} ${B(iceDom ? hotSales : iceSales)}. ${iceDom ? "Keep enough ice and cold cups for peaks, add seasonal iced drinks, and check ice-machine capacity." : "Focus on extraction/milk quality, warm the cups, and add special hot drinks in cooler weather."}` });

  recs.push({ color: "text",
    stat: `฿${topPrice} = ${pct(topPriceCups, totalCups)}% ${th ? "ของบิล" : "of bills"}`,
    title: th ? `ราคา ฿${topPrice} คือจุดสมดุล ใช้ดันอัปเซลล์` : `฿${topPrice} is the sweet spot for upsell`,
    body: th
      ? `แก้วราคา ฿${topPrice} ขายได้ ${n(topPriceCups)} แก้ว มากที่สุด ${nextTier ? `ตั้งคอมโบ/ไซซ์อัปให้ขยับจาก ฿${topPrice} ไป ฿${nextTier} ได้ง่าย เช่น เพิ่มช็อต/ท็อปปิ้ง +฿${nextTier - topPrice} เพิ่มยอดเฉลี่ยต่อแก้วทันที` : `ลองออกเมนูพรีเมียม/ไซซ์พิเศษเหนือ ฿${topPrice} เพื่อยกเพดานราคา`}`
      : `฿${topPrice} cups sell the most at ${n(topPriceCups)} cups. ${nextTier ? `Build combos/size-ups to nudge ฿${topPrice} → ฿${nextTier} (e.g. +฿${nextTier - topPrice} extra shot/topping) to raise the average ticket.` : `Introduce premium/special sizes above ฿${topPrice} to lift the price ceiling.`}` });

  if (worst && worst.p !== hero.p) {
    recs.push({ color: "clay",
      stat: th ? `ต่ำสุด ${B(worst.sales)}` : `lowest ${B(worst.sales)}`,
      title: th ? `${pn(worst.p)} ยอดน้อยสุด — ทบทวนเมนู` : `${pn(worst.p)} is the weakest — review it`,
      body: th
        ? `${pn(worst.p)} ขายได้ ${n(worst.qty)} แก้ว ต่ำกว่าทุกเมนู ลองจับคู่โปรโมชัน ปรับสูตร/ราคา หรือทำเป็นเมนูพิเศษหมุนเวียน หากยังไม่ขยับควรพิจารณาตัดเพื่อลดของเสียและความซับซ้อนหลังบาร์`
        : `${pn(worst.p)} sold ${n(worst.qty)} cups, below every other drink. Try a promo pairing, a recipe/price tweak, or a rotating special; if it stays flat, consider cutting it to reduce waste and bar complexity.` });
  }

  recs.push({ color: "jade",
    stat: th ? `${cupsPer.toFixed(2)} แก้ว/ลูกค้า` : `${cupsPer.toFixed(2)} cups/customer`,
    title: th ? "ดันยอดต่อหัวให้สูงขึ้น" : "Push per-head higher",
    body: th
      ? `เฉลี่ย ${B(baskPer)}/ลูกค้า (${cupsPer.toFixed(2)} แก้ว/คน) ทำโปร 'แก้วที่ 2 ลด' หรือเซ็ตคู่/ขนมจับคู่ ถ้าดันค่าเฉลี่ยขึ้นเป็น ${target.toFixed(1)} แก้ว/คน ยอดรวมจะโตราว ${growth}% โดยไม่ต้องหาลูกค้าใหม่`
      : `Average ${B(baskPer)}/customer (${cupsPer.toFixed(2)} cups each). Run a '2nd cup discount' or pairing sets; lifting to ${target.toFixed(1)} cups/customer grows total revenue ~${growth}% with no new customers.` });

  return recs;
}

const baht = (n) => "฿" + Math.round(n).toLocaleString("en-US");

// ── parser: คืน {rows, issues}
// rows = แถวที่ถูกต้อง · issues = แถวที่ "ดูเหมือนข้อมูล" แต่ค่าผิด (ไม่นับ แต่แจ้งเตือน)
// แยกแถวข้อมูลออกจากหัวตาราง/เส้นคั่น/ตารางสรุป ด้วย: คอลัมน์แรกเป็นเลขลำดับ + คอลัมน์ที่สองเป็นรหัสลูกค้า (ขึ้นต้นด้วยตัวอักษร)
function parseSheet(raw) {
  const rows = [], issues = [];
  let found = 0, maxNo = 0;
  for (let ln of String(raw).split(/\\r\\n|\\n|\r?\n/)) {
    const isMd = ln.indexOf("|") >= 0;
    if (!isMd && ln.indexOf(",") < 0) continue;
    let cells = (isMd ? ln.split("|") : ln.split(",")).map((c) => c.trim());
    if (isMd) { // ตัดเฉพาะช่องว่างขอบของ markdown (| ... |) ไม่แตะช่อง No. ที่เว้นว่าง
      if (cells.length && cells[0] === "") cells.shift();
      if (cells.length && cells[cells.length - 1] === "") cells.pop();
    }
    if (cells.length < 5) continue;

    // ยึดคอลัมน์ Product/Type/take จากเนื้อหา แล้วหาคอลัมน์อื่นจากตำแหน่งสัมพัทธ์
    // ลำดับมาตรฐาน: [No, Cus, Product, Type, take, Order, Price]
    const pi = cells.findIndex((c) => PRODUCTS.includes(c));
    const ti = cells.findIndex((c) => TYPES.includes(c));
    const ki = cells.findIndex((c) => TAKES.includes(c));
    if (pi < 0 && ti < 0 && ki < 0) continue; // หัวตาราง/เส้นคั่น/ตารางสรุปปี → ข้าม
    const base = pi >= 0 ? pi : (ti >= 0 ? ti - 1 : ki - 2); // index ของคอลัมน์ Product
    if (base < 0) continue;

    found++;
    const noNum = parseInt(cells[0], 10); if (!isNaN(noNum) && noNum > maxNo) maxNo = noNum;
    const snippet = ln.replace(/\s+/g, " ").trim().slice(0, 120);

    const cus = base - 1 >= 0 ? cells[base - 1] : "?";
    const product = cells[base], type = cells[base + 1], take = cells[base + 2];
    const order = cells[base + 3], price = cells[base + 4];
    if (price === undefined || type === undefined || take === undefined) { issues.push({ raw: snippet, code: "incomplete" }); continue; }
    if (!PRODUCTS.includes(product)) { issues.push({ raw: snippet, code: "product", val: product }); continue; }
    if (!TYPES.includes(type)) { issues.push({ raw: snippet, code: "type", val: type }); continue; }
    if (!TAKES.includes(take)) { issues.push({ raw: snippet, code: "service", val: take }); continue; }
    const pr = parseInt(price, 10);
    if (isNaN(pr)) { issues.push({ raw: snippet, code: "price", val: price }); continue; }
    const q = parseInt(order, 10) || 1;
    rows.push({ cus: cus || "?", p: product, t: type, k: take, pr, q });
  }
  return { rows, issues, found, maxNo };
}
// เก็บทุก string; ถ้าเป็น JSON ให้ parse เพื่อถอด \n ที่ escape แล้วใช้เฉพาะตัวที่ถอด (กันนับซ้ำ)
function collectText(node, acc, depth) {
  depth = depth || 0;
  if (node == null || depth > 6) return;
  if (typeof node === "string") {
    const t = node.trim();
    if (((t[0] === "{" && t[t.length - 1] === "}") || (t[0] === "[" && t[t.length - 1] === "]")) && t.length > 12) {
      try { collectText(JSON.parse(node), acc, depth + 1); return; } catch (_) {}
    }
    acc.push(node);
    return;
  }
  if (Array.isArray(node)) { for (const x of node) collectText(x, acc, depth + 1); return; }
  if (typeof node === "object") { for (const key in node) collectText(node[key], acc, depth + 1); }
}
function b64decode(s) {
  try {
    const clean = s.replace(/\s+/g, "");
    if (clean.length < 80 || !/^[A-Za-z0-9+/=]+$/.test(clean)) return "";
    const bin = atob(clean);
    return new TextDecoder("utf-8").decode(Uint8Array.from(bin, (ch) => ch.charCodeAt(0)));
  } catch (_) { return ""; }
}

async function fetchLiveData() {
  // ดึง CSV สาธารณะจาก Google Sheets (Publish to web) ตรง ๆ — ทุกคนเข้าถึงได้ ไม่ต้องล็อกอิน
  const url = CSV_URL + (CSV_URL.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now(); // กันแคชฝั่ง browser
  let res;
  try {
    res = await fetch(url, { cache: "no-store" });
  } catch (e) {
    throw new Error("NETWORK");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  const parsed = parseSheet(text);
  if (!parsed.rows.length) {
    const err = new Error("PARSE_FAIL");
    err.sample = (text || "(empty response)").slice(0, 4000);
    throw err;
  }
  return parsed;
}

function summarize(rows, f) {
  const sel = rows.filter((r) =>
    (f.product === null || r.p === f.product) &&
    (f.type === null || r.t === f.type) &&
    (f.take === null || r.k === f.take) &&
    (f.price === null || r.pr === f.price));
  let cups = 0, sales = 0; const custs = new Set();
  const prod = {}; PRODUCTS.forEach((p) => prod[p] = { name: p, sales: 0, qty: 0 });
  const typ = { hot: 0, ice: 0 }, tak = { "for here": 0, "to go": 0 }, price = {};
  for (const r of sel) {
    const v = r.pr * r.q;
    cups += r.q; sales += v; custs.add(r.cus);
    if (prod[r.p]) { prod[r.p].sales += v; prod[r.p].qty += r.q; }
    if (r.t in typ) typ[r.t] += v;
    if (r.k in tak) tak[r.k] += v;
    price[r.pr] = (price[r.pr] || 0) + r.q;
  }
  return { cups, sales, custCount: custs.size, prod, typ, tak, price };
}

      setRows(fresh.rows); setIssues(fresh.issues || []); setIssuesHidden(false); setIssuesOpen(false);
      setMeta({ valid: fresh.rows.length, found: fresh.found || 0, maxNo: fresh.maxNo || 0 });
      setSynced(true); setLastSync(new Date()); setStatus("ok");
    } catch (e) {
      const m = e.message || String(e);
      if (m === "PARSE_FAIL") setErrCode("parse");
      else if (m === "NETWORK") setErrCode("net");
      else { setErrCode("raw"); setErrRaw(m); }
      if (e.sample) { setDebugRaw(e.sample); setShowDebug(true); }
      setStatus("error");
    }
  }, []);

  const copyDebug = useCallback(() => {
    const text = debugRaw || "";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1600); }, () => {});
        return;
      }
    } catch (_) {}
    const el = document.getElementById("dbg-pre");
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
  }, [debugRaw]);

  // ดึงข้อมูลสดอัตโนมัติหนึ่งครั้งตอนเปิดแดชบอร์ด (seed ใช้แสดงผลทันทีระหว่างรอ)
  useEffect(() => {
    if (didMount.current) return;
    didMount.current = true;
    sync();
  }, [sync]);

  useEffect(() => {
    if (auto) { sync(); timer.current = setInterval(sync, 60000); }
    return () => { if (timer.current) clearInterval(timer.current); };
  }, [auto, sync]);

  const [, setTick] = useState(0);
  useEffect(() => { const t = setInterval(() => setTick((x) => x + 1), 1000); return () => clearInterval(t); }, []);

  const f = { product: fProduct, type: fType, take: fTake, price: fPrice };
  const S = useMemo(() => summarize(rows, f), [rows, fProduct, fType, fTake, fPrice]);
  const totalSales = useMemo(() => rows.reduce((s, r) => s + r.pr * r.q, 0), [rows]);
  const totalCusts = useMemo(() => new Set(rows.map((r) => r.cus)).size, [rows]);

  const byProduct = useMemo(() =>
    Object.values(S.prod).filter((d) => d.qty > 0).sort((a, b) => b.sales - a.sales)
      .map((d) => ({ ...d, label: pname(d.name) })), [S, lang]);
  const byType = useMemo(() => [
    { name: L.legIce, value: S.typ.ice, fill: T.jade },
    { name: L.legHot, value: S.typ.hot, fill: T.clay },
  ].filter((d) => d.value > 0), [S, T, L]);
  const byTake = useMemo(() => [
    { name: L.legTakeaway, value: S.tak["to go"], fill: T.gold },
    { name: L.legDinein, value: S.tak["for here"], fill: T.sky },
  ].filter((d) => d.value > 0), [S, T, L]);
  const byPrice = useMemo(() => [50, 60, 70].map((p) => ({ name: "฿" + p, value: S.price[p] || 0 })), [S]);

  const avg = S.cups ? S.sales / S.cups : 0;
  const basket = S.custCount ? S.sales / S.custCount : 0;
  const recs = useMemo(() => buildRecs(rows, lang), [rows, lang]);
  const reset = () => { setFProduct(null); setFType(null); setFTake(null); setFPrice(null); };
  const active = [fProduct, fType, fTake, fPrice].filter((x) => x !== null).length;

  const ago = lastSync ? Math.floor((Date.now() - lastSync.getTime()) / 1000) : null;
  const agoTxt = ago === null ? "" : ago < 60 ? L.agoSec(ago) : L.agoMin(Math.floor(ago / 60));
  const colorOf = (key) => (key === "text" ? T.text : T[key]);
  const reasonText = (it) => {
    const m = { product: L.rProduct, type: L.rType, service: L.rService, price: L.rPrice, incomplete: L.rIncomplete };
    return m[it.code] + (it.val ? `: "${it.val}"` : "");
  };

  return (
    <div className={"cd-root" + (theme === "light" ? " light" : "")}>
      <style>{CSS}</style>

      <header className="cd-head">
        <div className="cd-mark">
          <svg width="30" height="30" viewBox="0 0 34 34" fill="none">
            <path d="M6 13h17v7a8 8 0 01-8 8h-1a8 8 0 01-8-8v-7z" stroke={T.gold} strokeWidth="1.6"/>
            <path d="M23 15h3a3.5 3.5 0 010 7h-3" stroke={T.gold} strokeWidth="1.6"/>
            <path d="M11 4c-1 1.5-1 3 0 4.5M16 3.5c-1 1.5-1 3 0 4.5" stroke={T.jade} strokeWidth="1.5" strokeLinecap="round"/>
          </svg>
        </div>
        <div className="cd-titleblock">
          <h1>{L.title}</h1>
          <p>{L.subtitle(rows.length, totalCusts)}</p>
        </div>
        <div className="cd-toggles">
          <button className="icon-btn" title={L.themeTip} aria-label={L.themeTip} onClick={() => setTheme((v) => v === "dark" ? "light" : "dark")}>
            {theme === "dark" ? (
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.5" stroke="currentColor" strokeWidth="1.7"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>
            ) : (
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.5 6.5 0 009.8 9.8z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round"/></svg>
            )}
          </button>
          <div className="lang-pill">
            <button className={lang === "th" ? "on" : ""} onClick={() => setLang("th")}>ไทย</button>
            <button className={lang === "en" ? "on" : ""} onClick={() => setLang("en")}>EN</button>
          </div>
        </div>
      </header>

      <section className="cd-sync">
        <div className="sync-left">
          <span className={"sdot " + status} />
          <div className="sync-txt">
            <strong>{loading ? L.syncing : status === "error" ? L.syncFail : synced ? L.syncOk : L.syncIdle}</strong>
            <small className={status === "error" ? "err" : ""}>
              {status === "error" ? (errCode === "raw" ? errRaw : (L.err[errCode] || L.idleHint))
                : lastSync ? `${L.updated(agoTxt)} · ${rows.length} ${L.rowsWord}`
                : L.idleHint}
            </small>
          </div>
        </div>
        <div className="sync-right">
          <button className="sync-btn" onClick={sync} disabled={loading}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" className={loading ? "spin" : ""}>
              <path d="M21 12a9 9 0 11-3-6.7M21 3v5h-5" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            {loading ? L.syncingBtn : L.syncNow}
          </button>
          <label className="toggle">
            <span className="tg-label">{L.autoLabel}</span>
            <span className={"tg" + (auto ? " on" : "")} onClick={() => setAuto((v) => !v)} role="switch" aria-checked={auto}>
              <span className="knob" />
            </span>
          </label>
        </div>
      </section>

      {showDebug && debugRaw ? (
        <section className="cd-debug">
          <div className="dbg-bar">
            <span className="dbg-head">{L.dbgHead(debugRaw.length)}</span>
            <div className="dbg-actions">
              <button className="dbg-btn" onClick={copyDebug}>{copied ? L.copied : L.copy}</button>
              <button className="dbg-btn ghost" onClick={() => setShowDebug(false)}>{L.hide}</button>
            </div>
          </div>
          <pre id="dbg-pre" className="dbg-pre">{debugRaw}</pre>
        </section>
      ) : null}

      {meta && meta.maxNo > meta.found && !issuesHidden ? (
        <section className="cd-info">
          <div className="info-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 16.5h.01M10.3 3.9 2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/></svg>
            <div className="info-txt">
              <strong>{L.gapTitle(meta.found, meta.maxNo)}</strong>
              <small>{L.gapSub}</small>
            </div>
          </div>
        </section>
      ) : null}

      {issues.length > 0 && !issuesHidden ? (
        <section className="cd-info">
          <div className="info-row">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 16.5h.01M10.3 3.9 2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round"/></svg>
            <div className="info-txt">
              <strong>{L.invTitle(issues.length)}</strong>
              <small>{L.invSub}</small>
            </div>
            <div className="info-actions">
              <button className="info-btn" onClick={() => setIssuesOpen((o) => !o)}>{issuesOpen ? L.invHide : L.invShow}</button>
              <button className="info-x" aria-label="dismiss" onClick={() => setIssuesHidden(true)}>✕</button>
            </div>
          </div>
          {issuesOpen ? (
            <ul className="info-list">
              {issues.slice(0, 12).map((it, i) => (
                <li key={i}><span className="ic-reason">{reasonText(it)}</span><code>{it.raw}</code></li>
              ))}
              {issues.length > 12 ? <li className="ic-more">{L.invMore(issues.length - 12)}</li> : null}
            </ul>
          ) : null}
        </section>
      ) : null}

      <section className="cd-filters">
        <div className="seg-wrap">
          <span className="seg-label">{L.fMenu}</span>
          <div className="seg scroll">
            <button className={"seg-btn" + (fProduct === null ? " on" : "")} onClick={() => setFProduct(null)}>{L.all}</button>
            {PRODUCTS.map((p) => (
              <button key={p} className={"seg-btn" + (fProduct === p ? " on" : "")} onClick={() => setFProduct(p)}>{pname(p)}</button>
            ))}
          </div>
        </div>
        <Segmented label={L.fTemp} value={fType} onChange={setFType}
          options={[{ t: L.all, v: null }, { t: L.hot, v: "hot" }, { t: L.iced, v: "ice" }]} />
        <Segmented label={L.fServe} value={fTake} onChange={setFTake}
          options={[{ t: L.all, v: null }, { t: L.dinein, v: "for here" }, { t: L.takeaway, v: "to go" }]} />
        <Segmented label={L.fPrice} value={fPrice} onChange={setFPrice}
          options={[{ t: L.all, v: null }, { t: "฿50", v: 50 }, { t: "฿60", v: 60 }, { t: "฿70", v: 70 }]} />
        <button className={"reset" + (active ? " show" : "")} onClick={reset}>{L.clear} ({active})</button>
      </section>

      <section className="cd-kpis">
        <Kpi loading={loading} l={L.kSales} v={baht(S.sales)} s={L.salesSub(((S.sales / totalSales) * 100 || 0).toFixed(0))} c={T.gold} />
        <Kpi loading={loading} l={L.kCups} v={S.cups.toLocaleString()} s={L.cupsSub} c={T.text} />
        <Kpi loading={loading} l={L.kCusts} v={S.custCount.toLocaleString()} s={L.custsSub} c={T.text} />
        <Kpi loading={loading} l={L.kAvg} v={baht(avg)} s={L.avgSub} c={T.jade} />
        <Kpi loading={loading} l={L.kBasket} v={baht(basket)} s={L.basketSub} c={T.clay} />
      </section>

      <section className="cd-grid">
        <div className="card span2">
          <div className="card-h"><h3>{L.cSalesByMenu}</h3><span>{L.cHiLo}</span></div>
          {loading ? <Shimmer h={byProduct.length ? Math.max(150, byProduct.length * 44) : 200} />
            : byProduct.length ? (
            <ResponsiveContainer width="100%" height={Math.max(150, byProduct.length * 44)}>
              <BarChart data={byProduct} layout="vertical" margin={{ left: 4, right: 56, top: 4, bottom: 4 }}>
                <XAxis type="number" hide />
                <YAxis type="category" dataKey="label" width={90} tick={{ fill: T.text, fontSize: 12 }} axisLine={false} tickLine={false} />
                <Tooltip cursor={{ fill: theme === "dark" ? "#ffffff08" : "#00000008" }} content={<Tip T={T} suffix={L.bahtSuffix} />} />
                <Bar dataKey="sales" radius={[0, 6, 6, 0]} barSize={20}>
                  {byProduct.map((d, i) => <Cell key={i} fill={[T.gold, T.clay, T.jade, T.sky, T.plum][i % 5]} />)}
                  <LabelList dataKey="sales" position="right" formatter={(v) => baht(v)} style={{ fill: T.muted, fontSize: 11 }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          ) : <Empty L={L} />}
        </div>

        <div className="card">
          <div className="card-h"><h3>{L.cHotIce}</h3><span>{L.cShare}</span></div>
          {loading ? <DonutSkeleton /> : <Donut data={byType} T={T} L={L} />}
        </div>
        <div className="card">
          <div className="card-h"><h3>{L.cServe}</h3><span>{L.cShare}</span></div>
          {loading ? <DonutSkeleton /> : <Donut data={byTake} T={T} L={L} />}
        </div>

        <div className="card span2">
          <div className="card-h"><h3>{L.cPriceDist}</h3><span>{L.cCups}</span></div>
          {loading ? <Shimmer h={170} />
            : S.cups ? (
            <ResponsiveContainer width="100%" height={170}>
              <BarChart data={byPrice} margin={{ left: -20, right: 8, top: 12, bottom: 0 }}>
                <XAxis dataKey="name" tick={{ fill: T.text, fontSize: 12 }} axisLine={{ stroke: T.line }} tickLine={false} />
                <YAxis tick={{ fill: T.dim, fontSize: 11 }} axisLine={false} tickLine={false} />
                <Tooltip cursor={{ fill: theme === "dark" ? "#ffffff08" : "#00000008" }} content={<Tip T={T} suffix={L.cupSuffix} />} />
                <Bar dataKey="value" radius={[6, 6, 0, 0]} barSize={56}>
                  {byPrice.map((d, i) => <Cell key={i} fill={[T.goldDim, T.gold, "#f2c46b"][i]} />)}
                  <LabelList dataKey="value" position="top" style={{ fill: T.muted, fontSize: 12 }} />
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          ) : <Empty L={L} />}
        </div>
      </section>

      <section className="cd-analysis">
        <div className="an-head">
          <h2>{L.anaHead}</h2>
          <p>{L.anaSub}</p>
        </div>
        <div className="an-grid">
          {loading
            ? Array.from({ length: recs.length || 6 }).map((_, i) => <RecSkeleton key={i} />)
            : recs.map((r, i) => (
              <div className="rec" key={i}>
                <div className="rec-top">
                  <span className="rec-num">{String(i + 1).padStart(2, "0")}</span>
                  <span className="rec-stat" style={{ color: colorOf(r.color) }}>{r.stat}</span>
                </div>
                <h4>{r.title}</h4>
                <p>{r.body}</p>
              </div>
            ))}
        </div>
      </section>

      <footer className="cd-foot">{L.foot}</footer>
    </div>
  );
}

function Kpi({ l, v, s, c, loading }) {
  return (
    <div className="kpi">
      <div className="kpi-l">{l}</div>
      {loading ? (<><Shimmer h={26} w="72%" r={6} style={{ margin: "7px 0 5px" }} /><Shimmer h={9} w="50%" r={4} /></>)
        : (<><div className="kpi-v" style={{ color: c }}>{v}</div><div className="kpi-s">{s}</div></>)}
    </div>
  );
}
function Segmented({ label, options, value, onChange }) {
  return (
    <div className="seg-wrap">
      <span className="seg-label">{label}</span>
      <div className="seg">
        {options.map((o) => (
          <button key={String(o.v)} className={"seg-btn" + (value === o.v ? " on" : "")} onClick={() => onChange(o.v)}>{o.t}</button>
        ))}
      </div>
    </div>
  );
}
function Donut({ data, T, L }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (!total) return <Empty L={L} />;
  return (
    <div className="donut-row">
      <div className="donut-chart">
        <ResponsiveContainer width="100%" height={150}>
          <PieChart>
            <Pie data={data} dataKey="value" nameKey="name" innerRadius={42} outerRadius={62} paddingAngle={2} stroke="none">
              {data.map((d, i) => <Cell key={i} fill={d.fill} />)}
            </Pie>
            <Tooltip content={<Tip T={T} suffix={L.bahtSuffix} />} />
          </PieChart>
        </ResponsiveContainer>
      </div>
      <div className="legend">
        {data.map((d, i) => (
          <div className="leg" key={i}>
            <span className="dot" style={{ background: d.fill }} />
            <div><div className="leg-n">{d.name}</div><div className="leg-v">{baht(d.value)} · {((d.value / total) * 100).toFixed(0)}%</div></div>
          </div>
        ))}
      </div>
    </div>
  );
}
function DonutSkeleton() {
  return (
    <div className="donut-row">
      <div className="donut-chart" style={{ display: "grid", placeItems: "center", height: 150 }}>
        <div className="skel skel-ring" />
      </div>
      <div className="legend">
        <div className="leg"><Shimmer h={11} w={11} r={3} /><Shimmer h={12} w="70%" r={4} /></div>
        <div className="leg"><Shimmer h={11} w={11} r={3} /><Shimmer h={12} w="55%" r={4} /></div>
      </div>
    </div>
  );
}
function Shimmer({ h, w = "100%", r = 8, style }) {
  return <div className="skel" style={{ height: h, width: w, borderRadius: r, ...(style || {}) }} />;
}
function RecSkeleton() {
  return (
    <div className="rec">
      <div className="rec-top">
        <Shimmer h={13} w={22} r={4} />
        <Shimmer h={12} w="34%" r={4} />
      </div>
      <Shimmer h={14} w="85%" r={5} style={{ margin: "2px 0 9px" }} />
      <Shimmer h={10} w="100%" r={4} style={{ marginBottom: 6 }} />
      <Shimmer h={10} w="96%" r={4} style={{ marginBottom: 6 }} />
      <Shimmer h={10} w="60%" r={4} />
    </div>
  );
}
function Tip({ active, payload, suffix, T }) {
  if (!active || !payload || !payload.length) return null;
  const p = payload[0];
  return (<div style={{ background: T.tipBg, border: "1px solid " + T.line, borderRadius: 8, padding: "6px 10px", color: T.text, fontSize: 12, boxShadow: "0 4px 14px rgba(0,0,0,.25)" }}>
    <div style={{ color: T.muted }}>{p.payload.name}</div>
    <div style={{ fontWeight: 600 }}>{p.value.toLocaleString()}{suffix}</div></div>);
}
function Empty({ L }) { return <div className="empty">{L.empty}</div>; }

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap');
.cd-root{
  --bg:${THEMES.dark.bg};--panel:${THEMES.dark.panel};--panel2:${THEMES.dark.panel2};--line:${THEMES.dark.line};
  --text:${THEMES.dark.text};--muted:${THEMES.dark.muted};--dim:${THEMES.dark.dim};
  --gold:${THEMES.dark.gold};--goldDim:${THEMES.dark.goldDim};--jade:${THEMES.dark.jade};--clay:${THEMES.dark.clay};--red:${THEMES.dark.red};
  --code:#0e0b08;--shimmer:#ffffff16;--onAccent:${THEMES.dark.onAccent};
  font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--text);
  padding:clamp(12px,3vw,22px);border-radius:14px;min-height:100%;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;
  overflow-x:hidden;max-width:100%;
}
.cd-root.light{
  --bg:${THEMES.light.bg};--panel:${THEMES.light.panel};--panel2:${THEMES.light.panel2};--line:${THEMES.light.line};
  --text:${THEMES.light.text};--muted:${THEMES.light.muted};--dim:${THEMES.light.dim};
  --gold:${THEMES.light.gold};--goldDim:${THEMES.light.goldDim};--jade:${THEMES.light.jade};--clay:${THEMES.light.clay};--red:${THEMES.light.red};
  --code:#EFE6D8;--shimmer:#0000000f;--onAccent:#1a130b;
}
.cd-root *{box-sizing:border-box;}
.cd-root code{font-family:'Space Grotesk',monospace;background:var(--code);padding:1px 6px;border-radius:5px;color:var(--gold);font-size:.9em;}
.cd-head{display:flex;align-items:center;gap:13px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.cd-mark{width:46px;height:46px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:11px;flex:none;}
.cd-titleblock{flex:1;min-width:160px;}
.cd-titleblock h1{margin:0;font-size:clamp(17px,4.5vw,22px);font-weight:600;letter-spacing:-.01em;}
.cd-titleblock p{margin:3px 0 0;color:var(--muted);font-size:12px;font-family:'IBM Plex Sans Thai',sans-serif;}
.cd-toggles{display:flex;align-items:center;gap:8px;flex:none;}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);cursor:pointer;transition:all .15s;}
.icon-btn:hover{border-color:var(--gold);color:var(--gold);}
.lang-pill{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.lang-pill button{font-family:'IBM Plex Sans Thai',sans-serif;font-size:12px;font-weight:600;padding:7px 11px;background:var(--panel2);color:var(--muted);border:none;cursor:pointer;transition:all .15s;}
.lang-pill button.on{background:var(--gold);color:var(--onAccent);}
.cd-sync{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:14px;}
.sync-left{display:flex;align-items:center;gap:11px;min-width:0;}
.sdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim);}
.sdot.ok{background:var(--jade);animation:pulse 2.4s infinite;}
.sdot.syncing{background:var(--gold);animation:blink .9s infinite;}
.sdot.error{background:var(--red);}
@keyframes pulse{0%{box-shadow:0 0 0 0 #5bb89a55;}70%{box-shadow:0 0 0 7px #5bb89a00;}100%{box-shadow:0 0 0 0 #5bb89a00;}}
@keyframes blink{50%{opacity:.3;}}
.sync-txt{display:flex;flex-direction:column;min-width:0;}
.sync-txt strong{font-size:13px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;}
.sync-txt small{font-size:11px;color:var(--muted);font-family:'IBM Plex Sans Thai',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw;}
.sync-txt small.err{white-space:normal;overflow:visible;text-overflow:clip;max-width:none;line-height:1.45;color:var(--clay);}
.sync-right{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.sync-btn{display:inline-flex;align-items:center;gap:7px;font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;background:var(--gold);color:var(--onAccent);border:none;cursor:pointer;transition:filter .15s;}
.sync-btn:hover{filter:brightness(1.08);}
.sync-btn:disabled{opacity:.55;cursor:default;}
.spin{animation:spin 1s linear infinite;}@keyframes spin{to{transform:rotate(360deg);}}
.toggle{display:flex;align-items:center;gap:9px;cursor:pointer;}
.tg-label{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Sans Thai',sans-serif;}
.tg{width:40px;height:23px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .2s;flex:none;}
.tg .knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--dim);transition:all .2s;}
.tg.on{background:var(--jade);border-color:var(--jade);}
.tg.on .knob{left:19px;background:#0e1a16;}
.cd-info{background:var(--panel);border:1px solid var(--clay);border-left:3px solid var(--clay);border-radius:12px;padding:12px 15px;margin-bottom:14px;}
.info-row{display:flex;align-items:flex-start;gap:11px;}
.info-row>svg{color:var(--clay);flex:none;margin-top:1px;}
.info-txt{flex:1;min-width:0;display:flex;flex-direction:column;}
.info-txt strong{font-size:13px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;color:var(--clay);}
.info-txt small{font-size:11.5px;color:var(--muted);font-family:'IBM Plex Sans Thai',sans-serif;margin-top:1px;}
.info-actions{display:flex;gap:7px;align-items:center;flex:none;}
.info-btn{font-family:'IBM Plex Sans Thai',sans-serif;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;background:transparent;color:var(--clay);border:1px solid var(--clay);cursor:pointer;white-space:nowrap;}
.info-btn:hover{background:var(--clay);color:var(--onAccent);}
.info-x{background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1;}
.info-x:hover{color:var(--clay);}
.info-list{margin:11px 0 0;padding:11px 0 0;border-top:1px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:7px;max-height:210px;overflow:auto;}
.info-list li{font-size:11.5px;display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;font-family:'IBM Plex Sans Thai',sans-serif;}
.ic-reason{color:var(--clay);font-weight:600;flex:none;}
.info-list code{background:var(--code);color:var(--text);padding:1px 7px;border-radius:5px;font-family:'Space Grotesk',monospace;font-size:11px;word-break:break-word;}
.ic-more{color:var(--dim);}
.cd-debug{background:#0e0b08;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;}
.dbg-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;}
.dbg-head{font-size:11.5px;color:#A89685;font-family:'IBM Plex Sans Thai',sans-serif;}
.dbg-actions{display:flex;gap:7px;}
.dbg-btn{font-family:'IBM Plex Sans Thai',sans-serif;font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:7px;background:var(--gold);color:var(--onAccent);border:none;cursor:pointer;}
.dbg-btn.ghost{background:transparent;color:#A89685;border:1px solid #3B2D23;font-weight:500;}
.dbg-pre{margin:0;max-height:240px;overflow:auto;font-family:'Space Grotesk',monospace;font-size:11px;line-height:1.5;color:#F0E7DA;white-space:pre-wrap;word-break:break-word;user-select:all;-webkit-user-select:all;background:#000;padding:10px;border-radius:8px;}
.cd-filters{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-start;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;}
.seg-wrap{display:flex;flex-direction:column;gap:7px;max-width:100%;min-width:0;}
.seg-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;}
.seg{display:flex;flex-wrap:wrap;gap:6px;}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:3px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;}
.seg-btn{font-family:'IBM Plex Sans Thai',sans-serif;font-size:13px;padding:6px 13px;border-radius:999px;cursor:pointer;background:var(--panel2);color:var(--muted);border:1px solid var(--line);transition:all .15s;white-space:nowrap;flex:none;}
.seg-btn:hover{color:var(--text);border-color:var(--goldDim);}
.seg-btn.on{background:var(--gold);color:var(--onAccent);border-color:var(--gold);font-weight:600;}
.reset{margin-left:auto;align-self:flex-end;font-family:'IBM Plex Sans Thai',sans-serif;font-size:12.5px;padding:7px 14px;border-radius:8px;background:transparent;color:var(--dim);border:1px dashed var(--line);cursor:pointer;opacity:0;pointer-events:none;transition:all .15s;}
.reset.show{opacity:1;pointer-events:auto;color:var(--clay);border-color:var(--clay);}
.reset.show:hover{background:var(--clay);color:var(--onAccent);}
.cd-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;}
.kpi-l{font-size:11px;color:var(--muted);font-family:'IBM Plex Sans Thai',sans-serif;}
.kpi-v{font-size:clamp(20px,5vw,26px);font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;line-height:1;}
.kpi-s{font-size:10px;color:var(--dim);font-family:'IBM Plex Sans Thai',sans-serif;}
.cd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-bottom:20px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 17px;min-width:0;}
.card.span2{grid-column:span 2;}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;}
.card-h h3{margin:0;font-size:14.5px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;}
.card-h span{font-size:11px;color:var(--dim);font-family:'IBM Plex Sans Thai',sans-serif;white-space:nowrap;}
.donut-row{display:flex;align-items:center;gap:6px;}
.donut-chart{width:50%;flex:none;}
.legend{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0;}
.leg{display:flex;align-items:center;gap:9px;}
.leg .dot{width:11px;height:11px;border-radius:3px;flex:none;}
.leg-n{font-size:12px;color:var(--text);font-family:'IBM Plex Sans Thai',sans-serif;}
.leg-v{font-size:11px;color:var(--muted);margin-top:1px;}
.empty{height:150px;display:grid;place-items:center;color:var(--dim);font-size:13px;font-family:'IBM Plex Sans Thai',sans-serif;}
.skel{position:relative;overflow:hidden;background:var(--panel2);}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,var(--shimmer),transparent);animation:shimmer 1.3s infinite;}
@keyframes shimmer{100%{transform:translateX(100%);}}
.skel-ring{width:118px;height:118px;border-radius:50%;-webkit-mask:radial-gradient(circle 36px at 50% 50%,transparent 98%,#000 100%);mask:radial-gradient(circle 36px at 50% 50%,transparent 98%,#000 100%);}
.cd-analysis{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,4vw,22px);}
.an-head h2{margin:0;font-size:17px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;}
.an-head p{margin:4px 0 17px;color:var(--muted);font-size:12px;font-family:'IBM Plex Sans Thai',sans-serif;}
.an-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.rec{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:15px;position:relative;overflow:hidden;}
.rec:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);opacity:.55;}
.rec-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.rec-num{font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.05em;}
.rec-stat{font-size:12px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;}
.rec h4{margin:0 0 6px;font-size:14px;font-weight:600;font-family:'IBM Plex Sans Thai',sans-serif;line-height:1.35;}
.rec p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted);font-family:'IBM Plex Sans Thai',sans-serif;}
.cd-foot{margin-top:16px;text-align:center;color:var(--dim);font-size:11px;font-family:'IBM Plex Sans Thai',sans-serif;}
@media(max-width:880px){.cd-kpis{grid-template-columns:repeat(3,1fr);}.cd-grid{grid-template-columns:1fr;}.card.span2{grid-column:span 1;}.an-grid{grid-template-columns:1fr;}}
@media(max-width:560px){
  .cd-sync{flex-direction:column;align-items:stretch;}
  .sync-right{justify-content:space-between;}
  .sync-txt small{max-width:78vw;}
  .cd-kpis{grid-template-columns:repeat(2,1fr);}
  .cd-filters{flex-direction:column;align-items:stretch;gap:13px;}
  .seg-wrap{width:100%;}
  .seg.scroll{flex-wrap:wrap;overflow-x:visible;}
  .reset{margin-left:0;align-self:stretch;text-align:center;}
}
@media(max-width:480px){
  .donut-row{flex-direction:column;align-items:stretch;gap:6px;}
  .donut-chart{width:100%;}
  .legend{width:100%;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:10px 20px;}
  .card{padding:14px;}
}
@media(max-width:380px){.cd-kpis{grid-template-columns:1fr 1fr;}.kpi-v{font-size:19px;}}
`;


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(CoffeeDashboard));

</script>
