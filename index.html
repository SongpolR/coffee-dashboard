<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>แดชบอร์ดยอดขายร้านกาแฟ</title>
<style>html,body{margin:0;background:#17120E;}#root{margin:0 auto;}</style>
<!-- ตั้งสีพื้นหลังหน้าให้ตรงกับธีมที่บันทึกไว้ ก่อน React โหลด เพื่อไม่ให้เห็นพื้นเข้มวูบในธีมสว่าง -->
<script>try{var t=localStorage.getItem("cd_theme");if(t==="light"){document.documentElement.style.background="#FBF7F1";document.write('<style>html,body{background:#FBF7F1}<\/style>');}}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<!-- Firebase compat (รับสัญญาณเรียลไทม์จาก /signal) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<!-- App config (committed; ค่าไม่ลับ) -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<!-- แอป React (คอมไพล์ผ่าน Babel ในเบราว์เซอร์) — ต้องเสิร์ฟผ่าน http(s) ไม่ใช่ file:// -->
<script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
